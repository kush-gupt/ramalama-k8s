apiVersion: serving.kserve.io/v1alpha1
kind: ServingRuntime
metadata:
  annotations:
    opendatahub.io/apiProtocol: REST
    opendatahub.io/recommended-accelerators: '[]'
    opendatahub.io/runtime-version: latest
    openshift.io/display-name: Ramalama CPU ServingRuntime
  labels:
    opendatahub.io/dashboard: "true"
  name: ramalama-cpu-runtime
spec:
  annotations:
    prometheus.io/path: /metrics
    prometheus.io/port: "8080"
  containers:
  - args:
    - --port=8080
    - --model=/mnt/models
    - --alias={{.Name}}
    - --ctx-size=4096
    - --threads=-1
    - --temp=0.7
    - --top-k=40
    - --top-p=0.9
    - --min-p=0
    - --cache-reuse=256
    - --no-warmup
    - --jinja
    - --log-colors
    - --host=0.0.0.0
    - -ngl=0
    command:
    - /usr/bin/llama-server
    env:
    - name: HF_HOME
      value: /tmp/hf_home
    - name: HF_HUB_OFFLINE
      value: "1"
    image: quay.io/ramalama/ramalama:latest
    name: kserve-container
    ports:
    - containerPort: 8080
      protocol: TCP
    resources:
      limits:
        cpu: "8"
        memory: 16Gi
      requests:
        cpu: "2"
        memory: 4Gi
    livenessProbe:
      httpGet:
        path: /health
        port: 8080
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 5
    readinessProbe:
      httpGet:
        path: /health
        port: 8080
      initialDelaySeconds: 15
      periodSeconds: 5
      timeoutSeconds: 3
  multiModel: false
  supportedModelFormats:
  - autoSelect: true
    name: gguf
  - autoSelect: true
    name: llama
  - autoSelect: true
    name: ramalama
