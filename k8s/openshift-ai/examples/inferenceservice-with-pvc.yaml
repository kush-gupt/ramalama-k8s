apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  annotations:
    serving.kserve.io/deploymentMode: RawDeployment
  labels:
    opendatahub.io/dashboard: "true"
  name: my-model-ramalama
spec:
  predictor:
    minReplicas: 1
    model:
      modelFormat:
        name: gguf
      runtime: ramalama-cpu-runtime
      storageUri: pvc://my-model-pvc/path/to/model.gguf
    resources:
      limits:
        cpu: "8"
        memory: 16Gi
      requests:
        cpu: "4"
        memory: 8Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: my-model-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
  storageClassName: gp3-csi
