apiVersion: template.openshift.io/v1
kind: Template
metadata:
  annotations:
    description: Ramalama CPU ServingRuntime using llama.cpp for GGUF model inference
    opendatahub.io/apiProtocol: REST
    opendatahub.io/model-type: '["generative"]'
    opendatahub.io/modelServingSupport: '["single"]'
    openshift.io/display-name: Ramalama CPU ServingRuntime for KServe
    openshift.io/provider-display-name: Ramalama Community
    tags: rhods,rhoai,kserve,servingruntime,ramalama,llama.cpp,cpu,inference,gguf
    template.openshift.io/documentation-url: https://github.com/containers/ramalama
    template.openshift.io/long-description: >-
      This template defines resources needed to deploy Ramalama (llama.cpp based)
      CPU ServingRuntime with KServe in Red Hat OpenShift AI. It provides an
      OpenAI-compatible API for serving GGUF models without requiring GPU hardware.
  labels:
    opendatahub.io/dashboard: "true"
  name: ramalama-cpu
  namespace: redhat-ods-applications
objects:
- apiVersion: serving.kserve.io/v1alpha1
  kind: ServingRuntime
  metadata:
    annotations:
      opendatahub.io/apiProtocol: REST
      opendatahub.io/recommended-accelerators: '[]'
      opendatahub.io/runtime-version: latest
      openshift.io/display-name: Ramalama CPU ServingRuntime
    labels:
      opendatahub.io/dashboard: "true"
    name: ramalama-cpu-runtime
  spec:
    annotations:
      prometheus.io/path: /metrics
      prometheus.io/port: "8080"
    containers:
    - args:
      - --port=8080
      - --model=/mnt/models
      - --alias={{.Name}}
      - --cache-reuse=256
      - --no-warmup
      - --jinja
      - --log-colors
      - --host=0.0.0.0
      - -ngl=0
      command:
      - /usr/bin/llama-server
      image: quay.io/ramalama/ramalama:latest
      name: kserve-container
      ports:
      - containerPort: 8080
        protocol: TCP
      resources:
        limits:
          cpu: "8"
          memory: 16Gi
        requests:
          cpu: "2"
          memory: 4Gi
      livenessProbe:
        httpGet:
          path: /health
          port: 8080
        initialDelaySeconds: 30
        periodSeconds: 10
        timeoutSeconds: 5
      readinessProbe:
        httpGet:
          path: /health
          port: 8080
        initialDelaySeconds: 15
        periodSeconds: 5
        timeoutSeconds: 3
    multiModel: false
    supportedModelFormats:
    - autoSelect: true
      name: gguf
    - autoSelect: true
      name: ramalama
