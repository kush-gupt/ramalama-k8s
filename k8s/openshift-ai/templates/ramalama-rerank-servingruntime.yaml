apiVersion: template.openshift.io/v1
kind: Template
metadata:
  annotations:
    description: Ramalama CPU Reranking ServingRuntime using llama.cpp for document reranking
    opendatahub.io/apiProtocol: REST
    opendatahub.io/model-type: '["reranking"]'
    opendatahub.io/modelServingSupport: '["single"]'
    openshift.io/display-name: Ramalama CPU Reranking ServingRuntime for KServe
    openshift.io/provider-display-name: Ramalama Community
    tags: rhods,rhoai,kserve,servingruntime,ramalama,llama.cpp,cpu,rerank,reranking,gguf
    template.openshift.io/documentation-url: https://github.com/ggml-org/llama.cpp/blob/master/tools/server/README.md
    template.openshift.io/long-description: >-
      This template defines resources needed to deploy Ramalama (llama.cpp based)
      CPU Reranking ServingRuntime with KServe in Red Hat OpenShift AI. It provides
      a /v1/rerank API for document reranking without requiring GPU hardware.
      Use with reranker models like bge-reranker-v2-m3, bge-reranker-base, or jina-reranker.
  labels:
    opendatahub.io/dashboard: "true"
  name: ramalama-rerank
  namespace: redhat-ods-applications
objects:
- apiVersion: serving.kserve.io/v1alpha1
  kind: ServingRuntime
  metadata:
    annotations:
      opendatahub.io/apiProtocol: REST
      opendatahub.io/recommended-accelerators: '[]'
      opendatahub.io/runtime-version: latest
      openshift.io/display-name: Ramalama CPU Reranking ServingRuntime
    labels:
      opendatahub.io/dashboard: "true"
    name: ramalama-rerank-runtime
  spec:
    annotations:
      prometheus.io/path: /metrics
      prometheus.io/port: "8080"
    containers:
    - args:
      - --port=8080
      - --model=/mnt/models
      - --alias={{.Name}}
      - --embedding
      - --pooling=rank
      - --reranking
      - --batch-size=2048
      - --ubatch-size=512
      - --no-warmup
      - --host=0.0.0.0
      - -ngl=0
      command:
      - /usr/bin/llama-server
      image: quay.io/ramalama/ramalama:latest
      name: kserve-container
      ports:
      - containerPort: 8080
        protocol: TCP
      resources:
        limits:
          cpu: "4"
          memory: 4Gi
        requests:
          cpu: "1"
          memory: 1Gi
      livenessProbe:
        httpGet:
          path: /health
          port: 8080
        initialDelaySeconds: 15
        periodSeconds: 10
        timeoutSeconds: 5
      readinessProbe:
        httpGet:
          path: /health
          port: 8080
        initialDelaySeconds: 10
        periodSeconds: 5
        timeoutSeconds: 3
    multiModel: false
    supportedModelFormats:
    - autoSelect: true
      name: gguf
    - autoSelect: true
      name: reranker
