apiVersion: template.openshift.io/v1
kind: Template
metadata:
  annotations:
    description: Ramalama CPU ClusterServingRuntime using llama.cpp for GGUF model inference (cluster-wide)
    opendatahub.io/apiProtocol: REST
    opendatahub.io/model-type: '["generative"]'
    opendatahub.io/modelServingSupport: '["single"]'
    openshift.io/display-name: Ramalama CPU ClusterServingRuntime for KServe
    openshift.io/provider-display-name: Ramalama Community
    tags: rhods,rhoai,kserve,clusterservingruntime,ramalama,llama.cpp,cpu,inference,gguf
    template.openshift.io/documentation-url: https://github.com/containers/ramalama
    template.openshift.io/long-description: >-
      This template defines a ClusterServingRuntime for deploying Ramalama (llama.cpp based)
      CPU inference across the entire cluster. It provides an OpenAI-compatible API for 
      serving GGUF models without requiring GPU hardware. Deploy once, use in any namespace.
  labels:
    opendatahub.io/dashboard: "true"
  name: ramalama-cpu-cluster
  namespace: redhat-ods-applications
objects:
- apiVersion: serving.kserve.io/v1alpha1
  kind: ClusterServingRuntime
  metadata:
    annotations:
      opendatahub.io/apiProtocol: REST
      opendatahub.io/recommended-accelerators: '[]'
      opendatahub.io/runtime-version: latest
      openshift.io/display-name: Ramalama CPU ClusterServingRuntime
    labels:
      opendatahub.io/dashboard: "true"
    name: ramalama-cpu-cluster-runtime
  spec:
    annotations:
      prometheus.io/path: /metrics
      prometheus.io/port: "8080"
    containers:
    - args:
      - --port
      - "8080"
      - --model
      - /mnt/models
      - --alias
      - "{{.Name}}"
      - --cache-reuse
      - "256"
      - --no-warmup
      - --jinja
      - --log-colors
      - auto
      - --host
      - 0.0.0.0
      - -ngl
      - "0"
      command:
      - /usr/bin/llama-server
      env:
      - name: VK_ICD_FILENAMES
        value: ""
      - name: VK_DRIVER_FILES
        value: ""
      - name: CUDA_VISIBLE_DEVICES
        value: ""
      image: quay.io/ramalama/ramalama:latest
      name: kserve-container
      ports:
      - containerPort: 8080
        protocol: TCP
      resources:
        limits:
          cpu: "8"
          memory: 16Gi
        requests:
          cpu: "2"
          memory: 4Gi
      livenessProbe:
        httpGet:
          path: /health
          port: 8080
        initialDelaySeconds: 30
        periodSeconds: 10
        timeoutSeconds: 5
      readinessProbe:
        httpGet:
          path: /health
          port: 8080
        initialDelaySeconds: 15
        periodSeconds: 5
        timeoutSeconds: 3
    multiModel: false
    supportedModelFormats:
    - autoSelect: true
      name: gguf
    - autoSelect: true
      name: ramalama
