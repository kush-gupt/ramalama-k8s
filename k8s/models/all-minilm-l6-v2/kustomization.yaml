apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: ramalama-all-minilm-l6-v2
  annotations:
    argocd.argoproj.io/sync-wave: "1"

resources:
- ../base-model

namePrefix: "all-minilm-l6-v2-"

commonLabels:
  app.kubernetes.io/instance: "all-minilm-l6-v2"
  model: "all-minilm-l6-v2"

configMapGenerator:
- name: model-config
  behavior: replace
  literals:
  - MODEL_NAME=all-minilm-l6-v2
  - MODEL_FILE=/mnt/models/all-MiniLM-L6-v2-Q5_K_M.gguf/all-MiniLM-L6-v2-Q5_K_M.gguf
  - ALIAS=all-minilm-l6-v2-model
- name: ramalama-config
  behavior: merge
  literals:
  - CTX_SIZE=20048
  - THREADS=-1
  - TEMP=0.6
  - TOP_K=20
  - TOP_P=0.95
  - CACHE_REUSE=256

images:
- name: MODEL_IMAGE
  newName: "ghcr.io/kush-gupt/all-minilm-l6-v2-ramalama"
  newTag: latest 